[package]
name = "albus"
version = "2.2.0"
edition = "2021"
authors = ["oqullcan"]
description = "Pure Rust DPI bypass and encrypted DNS tool for Linux"
license = "GPL-3.0"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["rt-multi-thread", "net", "signal", "sync", "time", "io-util", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "tls12"] }
url = "2.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hickory-proto = { version = "0.26", default-features = false, features = ["std", "dnssec-aws-lc-rs"] }
libc = "0.2"
webpki-roots = "1.0"
getrandom = "0.2"

[build-dependencies]
cc = "1.1"

[profile.release]
opt-level = 3
lto = true
strip = true
# Deliberate (L23): abort on panic — a half-unwound root daemon holding
# iptables/eBPF/DNS state is worse than a clean crash + systemd restart
# (which re-applies protections within seconds). Cost: no backtraces from
# release crashes; diagnose via debug builds + journal context.
panic = "abort"
