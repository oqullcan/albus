[package]
name = "albus"
version = "1.4.0"
edition = "2021"
authors = ["albus team"]
description = "lightweight local anti-censorship and dpi evasion daemon"
default-run = "albus"

[[bin]]
name = "albus"
path = "src/main.rs"

[[bin]]
name = "albusdev"
path = "src/main.rs"

[[bin]]
name = "albus-core"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.38", features = ["net", "rt-multi-thread", "io-util", "macros", "time", "sync", "signal"] }
bytes = "1.6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
socket2 = "0.5"
zeroize = "1.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
