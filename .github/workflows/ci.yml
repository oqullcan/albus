name: ci

# Least privilege: every job gets read-only contents by default; the `build`
# job additionally grants actions:write for artifact upload (nothing else
# writes). Do not broaden without a documented reason.
permissions:
  contents: read

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # weekly audit sweep, Monday 06:00 UTC

# R6: pin the runner image (ubuntu-latest migrates Oct 2026 — kernel/header
# drift would silently change eBPF/DPI behavior) and avoid duplicate runs
# stacking on rapid pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned: see .github/pins.md
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # pinned: see .github/pins.md
        with:
          toolchain: 1.89
          components: rustfmt, clippy
      - name: Install eBPF build deps
        run: sudo apt-get update && sudo apt-get install -y clang llvm linux-headers-generic linux-libc-dev
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace -- -D warnings
      - name: unit + integration tests
        run: cargo test --workspace
      - name: robustness fuzz suite
        run: cargo test --test fuzz
      - name: docs sync check
        run: cargo test --test docs
      # audit tools release faster than our pinned toolchain (1.89 cannot
      # compile current cargo-audit); run them on stable, code stays pinned.
      - name: Install stable toolchain for audit tools
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # pinned: see .github/pins.md
        with:
          # pinned exact version (R4): floating `stable` made audit/cov
          # non-reproducible over time; bump deliberately with pins.md
          toolchain: 1.98.0
      - name: cargo audit (RustSec)
        uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # v2, pinned: see .github/pins.md
        env:
          # rust-toolchain.toml pins 1.89 for the build; audit tooling
          # needs a newer rustc, so override just for these steps
          RUSTUP_TOOLCHAIN: stable
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2, pinned: see .github/pins.md
        # NOTE: no RUSTUP_TOOLCHAIN here — the action is a self-contained
        # docker image; leaking the override in caused a visible rustup
        # error inside the container (CI #37 forensics).
        with:
          command: check

  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # No continue-on-error: CI #37 proved the hosted kernel loads our eBPF
    # program for real, so a kernel-job failure is a genuine regression
    # signal and must turn CI red.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned: see .github/pins.md
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # pinned: see .github/pins.md
        with:
          toolchain: 1.89
      - name: Install eBPF build deps
        run: sudo apt-get update && sudo apt-get install -y clang llvm linux-headers-generic linux-libc-dev
      # R9 forensic record: eBPF/DPI behavior is kernel-sensitive, so the
      # exact kernel stays in the log even when everything passes.
      - name: record kernel version
        run: uname -r && test -e /sys/kernel/btf/vmlinux && echo "BTF present" || echo "BTF MISSING"
      - name: real kernel eBPF load test (root)
        run: sudo -E ${HOME}/.cargo/bin/cargo test --release --test ebpf -- --ignored --nocapture
      - name: privileged firewall symmetry test (root)
        run: sudo -E ${HOME}/.cargo/bin/cargo test --release --test root -- --ignored --nocapture

  # Live DPI evasion proof: a real RST-injection simulator (scripts/dpi_sim.py)
  # must RST handshakes with albus OFF (proves the simulator is live — a test
  # that passes without any RST proves nothing) and stay silent with albus ON
  # (proves MSS-clamp/fake-injection evasion). Deliberately NOT
  # continue-on-error: either direction failing is a real regression signal.
  # NOTE: this job lives apart from `kernel` (which is informational until
  # runner kernels stabilize) precisely so a failure here turns CI red.
  dpi-evasion:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned: see .github/pins.md
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # pinned: see .github/pins.md
        with:
          toolchain: 1.89
      - name: Install eBPF build deps
        run: sudo apt-get update && sudo apt-get install -y clang llvm linux-headers-generic linux-libc-dev
      - name: release build (evasion daemon)
        run: cargo build --release
      - name: Phase A — simulator validity (albus OFF must RST)
        run: |
          set +e
          sudo -E python3 scripts/dpi_sim.py run --iface lo --targets roblox.com,discord.com | tee /tmp/dpi_off.log
          SIM_RC=${PIPESTATUS[0]}
          set -e
          echo "sim exit code (albus OFF): ${SIM_RC} (non-zero expected: nothing bypassed)"
          python3 scripts/dpi_evasion_check.py off /tmp/dpi_off.log
          test "${SIM_RC}" -ne 0
      - name: Phase B — evasion (albus ON must establish)
        run: |
          # Minimal daemon: no DoH listener, no firewall rules — only the eBPF
          # sock_ops clamp + raw-socket injector under test. Foreground process,
          # SIGTERM shuts it down gracefully (restores anything it applied).
          sudo -E ./target/release/albus run --doh=false --kill-switch=false --block-quic=false --block-stun=false --block-ipv6=false --dnssec=false --pqc=false > /tmp/albus.log 2>&1 &
          echo $! > /tmp/albus_sudo.pid
          cleanup() { sudo pkill -TERM -f 'target/release/albus run' 2>/dev/null || true; }
          trap cleanup EXIT
          sleep 10
          if ! sudo kill -0 "$(cat /tmp/albus_sudo.pid)" 2>/dev/null; then
            echo "albus daemon failed to start:"
            cat /tmp/albus.log
            exit 1
          fi
          echo "albus daemon alive, running evasion lab..."
          set +e
          sudo -E python3 scripts/dpi_sim.py run --iface lo --targets roblox.com,discord.com | tee /tmp/dpi_on.log
          SIM_RC=${PIPESTATUS[0]}
          set -e
          echo "sim exit code (albus ON): ${SIM_RC} (zero expected: all bypassed)"
          python3 scripts/dpi_evasion_check.py on /tmp/dpi_on.log
          test "${SIM_RC}" -eq 0

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # artifact upload needs actions:write on top of the read-only default;
    # keyless Sigstore signing needs id-token:write (OIDC to Fulcio).
    permissions:
      contents: read
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned: see .github/pins.md
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # pinned: see .github/pins.md
        with:
          toolchain: 1.89
      - name: Install eBPF build deps
        run: sudo apt-get update && sudo apt-get install -y clang llvm linux-headers-generic linux-libc-dev
      - name: release build
        run: cargo build --release
      - name: checksum
        run: sha256sum target/release/albus | tee albus.sha256
      # R7 provenance: keyless Sigstore signature (Fulcio + Rekor) so
      # downstream users can verify the binary came from this workflow.
      # cosign v3 uses the bundle format (separate --output-signature /
      # --output-certificate flags were removed). Anyone can verify offline:
      # cosign verify-blob --bundle albus.bundle --certificate-identity
      # "https://github.com/oqullcan/albus/.github/workflows/ci.yml@refs/heads/develop"
      # --certificate-oidc-issuer https://token.actions.githubusercontent.com
      # target/release/albus
      # NOTE: signing gates artifact upload deliberately — an unsigned
      # binary artifact with a silently skipped signature would be worse
      # than no artifact (false provenance confidence).
      - name: Install cosign
        uses: sigstore/cosign-installer@828df1e55de306ba29db814d6057ddae71883cda # pinned: see .github/pins.md
        with:
          cosign-release: v3.1.3
      - name: sign release binary (Sigstore keyless)
        run: cosign sign-blob --yes --bundle albus.bundle target/release/albus
      - name: upload signature bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, pinned: see .github/pins.md
        with:
          name: albus-sigstore
          path: albus.bundle
      - name: upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, pinned: see .github/pins.md
        with:
          name: albus-linux-x86_64
          path: target/release/albus
      - name: upload checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, pinned: see .github/pins.md
        with:
          name: albus-sha256
          path: albus.sha256

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned: see .github/pins.md
        with:
          persist-credentials: false
      - name: Install stable toolchain with llvm-tools
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # pinned: see .github/pins.md
        with:
          # pinned exact version, see above
          toolchain: 1.98.0
          components: llvm-tools-preview
      - name: Install eBPF build deps
        run: sudo apt-get update && sudo apt-get install -y clang llvm linux-headers-generic linux-libc-dev
      - name: Install cargo-llvm-cov
        # pinned to the locally validated version; bump deliberately (see pins.md)
        run: cargo install cargo-llvm-cov --locked --version 0.9.1
        env:
          RUSTUP_TOOLCHAIN: stable
      - name: coverage gate (workspace, min 55% lines)
        run: cargo llvm-cov --workspace --fail-under-lines 55 --summary-only
        env:
          RUSTUP_TOOLCHAIN: stable
