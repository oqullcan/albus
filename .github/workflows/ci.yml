name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Lint, Test & Fuzz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Verify Code Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Linter (-D warnings)
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Run Unit & Integration Tests
        run: cargo test --release --all-targets --verbose

      - name: Run Fuzz & Robustness Harness
        run: cargo test --release --test fuzz_robustness --verbose

  build:
    name: Release Binary Build
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release

      - name: Inspect Binary
        run: |
          ls -lh target/release/albus
          file target/release/albus

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: albus-linux-x86_64
          path: target/release/albus
          retention-days: 14
