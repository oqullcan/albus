name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # weekly audit sweep, Monday 06:00 UTC

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4 # pinned: see .github/pins.md
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # pinned: see .github/pins.md
        with:
          toolchain: 1.89
          components: rustfmt, clippy
      - name: Install eBPF build deps
        run: sudo apt-get update && sudo apt-get install -y clang llvm linux-headers-generic linux-libc-dev
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace -- -D warnings
      - name: unit + integration tests
        run: cargo test --workspace
      - name: robustness fuzz suite
        run: cargo test --test fuzz
      - name: docs sync check
        run: cargo test --test docs
      # audit tools release faster than our pinned toolchain (1.89 cannot
      # compile current cargo-audit); run them on stable, code stays pinned.
      - name: Install stable toolchain for audit tools
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # pinned: see .github/pins.md
        with:
          toolchain: stable
      - name: cargo audit (RustSec)
        uses: rustsec/audit-check@v2 # pinned: see .github/pins.md
        env:
          # rust-toolchain.toml pins 1.89 for the build; audit tooling
          # needs a newer rustc, so override just for these steps
          RUSTUP_TOOLCHAIN: stable
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2 # pinned: see .github/pins.md
        env:
          RUSTUP_TOOLCHAIN: stable
        with:
          command: check

  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true # informational until runner kernels stabilize
    steps:
      - uses: actions/checkout@v4 # pinned: see .github/pins.md
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # pinned: see .github/pins.md
        with:
          toolchain: 1.89
      - name: Install eBPF build deps
        run: sudo apt-get update && sudo apt-get install -y clang llvm linux-headers-generic linux-libc-dev
      - name: real kernel eBPF load test (root)
        run: sudo -E ${HOME}/.cargo/bin/cargo test --release --test ebpf -- --ignored --nocapture
      - name: privileged firewall symmetry test (root)
        run: sudo -E ${HOME}/.cargo/bin/cargo test --release --test root -- --ignored --nocapture

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4 # pinned: see .github/pins.md
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # pinned: see .github/pins.md
        with:
          toolchain: 1.89
      - name: Install eBPF build deps
        run: sudo apt-get update && sudo apt-get install -y clang llvm linux-headers-generic linux-libc-dev
      - name: release build
        run: cargo build --release
      - name: checksum
        run: sha256sum target/release/albus | tee albus.sha256
      - name: upload binary
        uses: actions/upload-artifact@v4 # pinned: see .github/pins.md
        with:
          name: albus-linux-x86_64
          path: target/release/albus
      - name: upload checksum
        uses: actions/upload-artifact@v4 # pinned: see .github/pins.md
        with:
          name: albus-sha256
          path: albus.sha256

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4 # pinned: see .github/pins.md
        with:
          persist-credentials: false
      - name: Install stable toolchain with llvm-tools
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # pinned: see .github/pins.md
        with:
          toolchain: stable
          components: llvm-tools-preview
      - name: Install eBPF build deps
        run: sudo apt-get update && sudo apt-get install -y clang llvm linux-headers-generic linux-libc-dev
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
        env:
          RUSTUP_TOOLCHAIN: stable
      - name: coverage gate (workspace, min 55% lines)
        run: cargo llvm-cov --workspace --fail-under-lines 55 --summary-only
        env:
          RUSTUP_TOOLCHAIN: stable
