# cargo-deny configuration: licenses, advisories, bans, sources.
# See CONTRIBUTING.md ("Dependency Maintenance") for the update discipline.
#
# Known benign warnings (do not "fix" without reading this):
# - warning[parse-error] on OUR OWN license field: Cargo.toml declares the
#   deprecated SPDX spelling "GPL-3.0" deliberately (see allow-list NOTE).
# - warning[duplicate] on getrandom/syn/untrusted: multiple versions are
#   policy "warn", not "deny" (see [bans] below).

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
]

[licenses]
# Minimal allow-list: every entry below is encountered in the current tree
# (`cargo deny check` warns on unmatched allowances). Adding a license is a
# deliberate decision — see CONTRIBUTING.md. Unused spellings/variants were
# removed 2026-09-21 so future additions fail closed, not silent.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    # NOTE: "GPL-3.0" is the deprecated SPDX spelling the project itself
    # declares (Cargo.toml); kept explicitly, do not "fix" without a
    # licensing decision. Same for CDLA-Permissive-2.0 (webpki-roots data).
    "GPL-3.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
]
exceptions = []

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
db-path = "~/.cargo/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
unmaintained = "workspace"
unsound = "workspace"
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
