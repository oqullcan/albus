# cargo-deny configuration: licenses, advisories, bans, sources.
# See CONTRIBUTING.md ("Dependency Maintenance") for the update discipline.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # NOTE: "GPL-3.0" is the deprecated SPDX spelling the project itself
    # declares (Cargo.toml); kept explicitly, do not "fix" without a
    # licensing decision. Same for CDLA-Permissive-2.0 (webpki-roots data).
    "GPL-3.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "OpenSSL",
    "Zlib",
    "NCSA",
]
exceptions = []

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
db-path = "~/.cargo/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
unmaintained = "workspace"
unsound = "workspace"
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
